name: Feature request
description: A scanner, a guard, a model adapter or another improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which decision model, which failure, and how often you see it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
