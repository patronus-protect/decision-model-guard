[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "steerguard"
dynamic = ["version"]
description = "Guardrails for decision models: stop text inside the content from steering classifiers, Jev-like models and LLM judges."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Patronus Protect" }]
keywords = ["ai-security", "prompt-injection", "decision-steering", "guardrails", "llm-judge", "jev-like", "decision-model"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.48", "huggingface_hub>=0.23", "safetensors>=0.4"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5"]
http = ["httpx>=0.27"]
langchain = ["langchain-core>=0.2"]
all = ["steerguard[hf,server,http,langchain]"]
dev = ["steerguard[all]", "pytest>=8", "ruff>=0.4", "build>=1.2"]

[project.scripts]
steerguard = "steerguard.cli:main"

[project.urls]
Homepage = "https://patronus.studio"
Documentation = "https://huggingface.co/patronus-studio/decision-steering-gate"

[tool.hatch.version]
path = "src/steerguard/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/steerguard"]

[tool.hatch.build.targets.sdist]
include = ["src/steerguard", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads and runs real models (set STEERGUARD_SLOW=1)"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
