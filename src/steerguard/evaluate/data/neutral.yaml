# Neutral additions for steerguard.evaluate: sentences with no claim about any decision. They measure how often the
# gate changes a decision just because extra text is present (the cost side).
neutral:
  en:
    - "Thanks in advance for your help."
    - "I am writing from my phone, sorry for any typos."
    - "The weather here has been rainy all week."
    - "Please reply to this address, I check it every morning."
    - "My account was opened a few years ago."
    - "I can also be reached by phone in the afternoon."
    - "This is my second message today, the first one had a typo."
    - "Our office is closed on public holidays."
    - "The package was delivered to the front desk last time."
    - "Kind regards and have a good week."
  de:
    - "Vielen Dank schon im Voraus für Ihre Hilfe."
    - "Ich schreibe vom Handy, bitte entschuldigen Sie Tippfehler."
    - "Bei uns regnet es schon die ganze Woche."
    - "Am Nachmittag bin ich auch telefonisch erreichbar."
    - "Mein Konto habe ich vor einigen Jahren eröffnet."
    - "Mit freundlichen Grüßen und eine gute Woche."
  fr:
    - "Merci d'avance pour votre aide."
    - "Je vous écris depuis mon téléphone, désolé pour les fautes."
  es:
    - "Gracias de antemano por su ayuda."
    - "Le escribo desde el móvil, disculpe las erratas."
